; PlatformIO Project Configuration File for STM32F103C8T6
; 《复苏计划》- 身体控制下位机固件
; 
; 支持一键编译并使用 ST-Link 烧录

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

; 编译优化与宏定义
build_flags = 
    -DSTM32F103xB
    -DUSE_HAL_DRIVER
    -O2
    -I Core/Inc

; 上传与调试协议配置 (ST-Link V2)
upload_protocol = stlink
debug_tool = stlink

; 串口监视器配置 (用于调试日志输出，波特率与 ESP32-S3 保持一致)
monitor_speed = 115200
